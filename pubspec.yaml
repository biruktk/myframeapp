name: myframe
description: MyFrame Flutter mobile app (iOS + Android)
publish_to: "none"
version: 0.1.0+19

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  image: ^4.3.0
  http: ^1.2.2
  image_picker: ^1.1.2
  crypto: ^3.0.6
  mobile_scanner: ^7.2.0
  share_plus: ^10.1.4
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5
  path: ^1.9.0
  cupertino_icons: ^1.0.8
  connectivity_plus: ^6.0.0
  flutter_blue_plus: ">=1.32.0 <2.0.0"
  permission_handler: ^12.0.3
  app_links: ^6.3.3
  sign_in_with_apple:
    path: third_party/sign_in_with_apple
  qr_flutter: ^4.1.0
  app_settings: ^7.0.0
  file_picker: ^11.0.2
  url_launcher: ^6.3.2
  google_sign_in: ^6.2.2
  receive_sharing_intent:
    path: third_party/receive_sharing_intent
  fluwx:
    path: third_party/fluwx
  permission_handler_apple: ^9.4.9
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/google_logo.png
    - assets/branding/myframe_app_icon.png
    - assets/branding/myframe_logo.jpg
    - assets/branding/myframe_logo.png
    - assets/branding/myframe_splash_logo.jpg
    - assets/branding/myframe_splash_logo.png

fluwx:
  app_id: wx452059b9ecaf1fc0
  universal_link: https://myframe.ink/
  flutter_activity: com.myframe.minyuex.MainActivity
  scene_delegate: SceneDelegate
