name: myframe
description: MyFrame Flutter mobile app (iOS + Android)
publish_to: "none"
version: 0.1.0+11

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  image: ^4.3.0
  http: ^1.2.2
  image_picker: ^1.1.2
  crypto: ^3.0.6
  mobile_scanner: ^7.2.0
  share_plus: ^10.1.4
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5
  path: ^1.9.0
  cupertino_icons: ^1.0.8
  connectivity_plus: ^6.0.0
  flutter_blue_plus: ">=1.32.0 <2.0.0"
  permission_handler: ^11.3.1
  app_links: ^6.3.3
  sign_in_with_apple: ^7.0.1
  qr_flutter: ^4.1.0
  app_settings: ^5.2.0
  file_picker: ^8.3.7
  url_launcher: ^6.3.2
  google_sign_in: ^6.2.2
  receive_sharing_intent: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/myframe_logo.png
    - assets/branding/myframe_splash_logo.png
